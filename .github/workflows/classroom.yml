name: GitHub Classroom Workflow - Week12
on:
  push:
    paths:
      - 'chapter12/**'
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  build:
    name: Autograding Week12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: week12-01-chstrprt
        id: week12-01-chstrprt
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-01-chstrprt
          setup-command: gcc chapter12/01chstrprt.c -o w1201
          command: ./w1201
          input: ""
          expected-output: "C #"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-03-strsplit
        id: week12-03-strsplit
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-03-strsplit
          setup-command: gcc chapter12/03strsplit.c -o w1203
          command: ./w1203
          input: ""
          expected-output: "C C++ Java"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-06-strfun
        id: week12-06-strfun
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-06-strfun
          setup-command: gcc chapter12/06strfun.c -o w1206
          command: ./w1206
          input: ""
          expected-output: "strncmp(C lang, C , 2) = 0"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-07-strcpycat
        id: week12-07-strcpycat
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-07-strcpycat
          setup-command: gcc chapter12/07strcpycat.c -o w1207
          command: ./w1207
          input: ""
          expected-output: "C is a procedural language."
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-08-strtok
        id: week12-08-strtok
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-08-strtok
          setup-command: gcc chapter12/08strtok.c -o w1208
          command: ./w1208
          input: ""
          expected-output: "best"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-10-strary
        id: week12-10-strary
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-10-strary
          setup-command: gcc chapter12/10strary.c -o w1210
          command: ./w1210
          input: ""
          expected-output: "A # +"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-11-cmdarg
        id: week12-11-cmdarg
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-11-cmdarg
          setup-command: gcc chapter12/11cmdarg.c -o w1211
          command: ./w1211
          input: ""
          expected-output: "argc = 1"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-lab1-lineprt
        id: week12-lab1-lineprt
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-lab1-lineprt
          setup-command: gcc "-Dgets_s(s,n)=gets(s)" chapter12/lab1lineprt.c -o w12lab1
          command: ./w12lab1
          input: "Hello World"
          expected-output: "Hello World"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-lab2-reversestr
        id: week12-lab2-reversestr
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-lab2-reversestr
          setup-command: gcc chapter12/lab2reversestr.c -o w12lab2
          command: ./w12lab2
          input: ""
          expected-output: "C nohtyP"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-lab3-strprocess
        id: week12-lab3-strprocess
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-lab3-strprocess
          setup-command: gcc chapter12/lab3strprocess.c -o w12lab3
          command: ./w12lab3
          input: ""
          expected-output: "y o e"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: week12-lab4-mtable
        id: week12-lab4-mtable
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: week12-lab4-mtable
          setup-command: gcc "-Dgets_s(s,n)=gets(s)" chapter12/lab4mtable.c -o w12lab4
          command: ./w12lab4
          input: "Hello"
          expected-output: "olleH"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        continue-on-error: true
        env:
          WEEK12-01-CHSTRPRT_RESULTS: "${{steps.week12-01-chstrprt.outputs.result}}"
          WEEK12-03-STRSPLIT_RESULTS: "${{steps.week12-03-strsplit.outputs.result}}"
          WEEK12-06-STRFUN_RESULTS: "${{steps.week12-06-strfun.outputs.result}}"
          WEEK12-07-STRCPYCAT_RESULTS: "${{steps.week12-07-strcpycat.outputs.result}}"
          WEEK12-08-STRTOK_RESULTS: "${{steps.week12-08-strtok.outputs.result}}"
          WEEK12-10-STRARY_RESULTS: "${{steps.week12-10-strary.outputs.result}}"
          WEEK12-11-CMDARG_RESULTS: "${{steps.week12-11-cmdarg.outputs.result}}"
          WEEK12-LAB1-LINEPRT_RESULTS: "${{steps.week12-lab1-lineprt.outputs.result}}"
          WEEK12-LAB2-REVERSESTR_RESULTS: "${{steps.week12-lab2-reversestr.outputs.result}}"
          WEEK12-LAB3-STRPROCESS_RESULTS: "${{steps.week12-lab3-strprocess.outputs.result}}"
          WEEK12-LAB4-MTABLE_RESULTS: "${{steps.week12-lab4-mtable.outputs.result}}"
        with:
          runners: week12-01-chstrprt,week12-03-strsplit,week12-06-strfun,week12-07-strcpycat,week12-08-strtok,week12-10-strary,week12-11-cmdarg,week12-lab1-lineprt,week12-lab2-reversestr,week12-lab3-strprocess,week12-lab4-mtable
